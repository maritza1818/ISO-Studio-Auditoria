services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: America/Lima
      GENERIC_TIMEZONE: America/Lima
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - agente_private

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Definir QDRANT_API_KEY en el archivo .env}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - agente_private
    # Sin puerto publicado en la PC; el nodo n8n accede a http://qdrant:6333

networks:
  agente_private:
    driver: bridge

volumes:
  n8n_data:
  qdrant_data:
